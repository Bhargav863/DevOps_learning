# variables defining as a list
# A list is an ordered collection of items. Each item can be of any data type (strings, numbers, other lists, or dictionaries).
# Use Cases: Useful for iterating over multiple values (e.g., a list of servers, application versions, or tasks to perform).

port_nums: [21,22,23,24,25,80,443,8443]

users:
  - ram
  - bhargav
  - ansible

# variables defining as a dictionaries.
# A dictionary stores data in key-value pairs. Each key must be unique and is used to retrieve its associated value.
# Use Cases: Ideal for grouping related configurations (e.g., database connection details, user profiles, or network device settings).
user_vars:
     bob:
      username: bob
      group: wheel
      uid: 1122
      shell: /bin/bash

     lisa:
      username: lisa
      group: wheel
      uid: 2233
      shell: /bin/bash