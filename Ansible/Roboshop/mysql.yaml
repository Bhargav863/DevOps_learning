- name: setup the mysql server
  hosts: mysql
  become: yes
  tasks:
    - name: Install the mysql server
      ansible.builtin.apt:
         name: mysql-server
         state: present
    - name: start and enable the service
      ansible.builtin.service:
         name: mysql
         state: started
         enabled: yes
    - name: Set MySQL root password
      community.mysql.mysql_user:
        login_user: root
        login_password: ""
        user: root
        host_all: yes
        password: "RoboShop@1"
        check_implicit_admin: yes
        state: present
