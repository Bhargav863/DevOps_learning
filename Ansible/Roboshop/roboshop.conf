server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /usr/share/nginx/html;
    index index.html;

    server_name _;

    proxy_http_version 1.1;

    location / {
        try_files $uri $uri/ =404;
    }

    location /images/ {
        expires 5s;
        root   /usr/share/nginx/html;
        try_files $uri /images/placeholder.jpg;
    }

    location /api/catalogue/ { proxy_pass http://catalogue:8080/; }

    location /health {
        stub_status on;
        access_log off;
    }
}
