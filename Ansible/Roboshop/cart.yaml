- name: configure the cart component
  hosts: cart
  vars:
    user: roboshop
  become: yes
  tasks:
    - name: setup the nodejs repositories
      ansible.builtin.shell: "curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -"
    - name: Install the nodejs
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: yes
    - name: Create the app directory
      ansible.builtin.file:
        path: /app
        state: directory
    - name: check the systemuser is present or not
      ansible.builtin.command: id {{ user }}
      register: output
      ignore_errors: true
    - name: Create the user if not present
      ansible.builtin.user:
         name: "{{ user }}"
         shell: /sbin/nologin
         system: true
         home: /app
      when: output.rc != 0
    - name: Download the cart files into /tmp directory
      ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
         dest: /tmp/cart-v3.zip
    - name: unarchive the cart files in /app directory
      ansible.builtin.unarchive:
         src: /tmp/cart-v3.zip
         dest: /app
         remote_src: yes
    - name: Install dependencies
      ansible.builtin.command: npm install
      args:
        chdir: /app
    - name: copy cart service file to systemd directory
      ansible.builtin.copy:
         src: cart.service
         dest: /etc/systemd/system/cart.service
    - name: reload the daemon
      ansible.builtin.systemd:
         daemon_reload: true
    - name: start and enable cart
      ansible.builtin.service:
        name: cart
        state: restarted
        enabled: yes
    