- name: Create the app directory
  ansible.builtin.file:
    path: /app
    state: directory
- name: check the systemuser is present or not
  ansible.builtin.command: id roboshop
  register: output
  ignore_errors: true
- name: Create the user if not present
  ansible.builtin.user:
     name: roboshop
     shell: /sbin/nologin
     system: true
     home: /app
  when: output.rc != 0
- name: Download the {{ component }} files into /tmp directory
  ansible.builtin.get_url:
    url: https://roboshop-builds.s3.amazonaws.com/{{ component }}.zip
    dest: /tmp/{{ component }}.zip
- name: unarchive the {{ component }} files in /app directory
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes