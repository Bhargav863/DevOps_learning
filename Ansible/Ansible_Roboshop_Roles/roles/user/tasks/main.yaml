- name: Install nodejs
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs
- name: setup the app dir and extract the files
  ansible.builtin.import_role:
    name: common
    tasks_from: app_setup
- name: Install dependencies
  ansible.builtin.command: npm install
  args:
    chdir: /app
- name: setup the mongodb repo
  ansible.builtin.import_role:
     name: common
     tasks_from: mongo.yaml
- name: install the mongodb
  ansible.builtin.apt:
    name: mongodb-mongosh
    state: present
    update_cache: yes
- name: Load the catalogue data
  ansible.builtin.shell: mongosh --host mongo < /app/schema/user.js
- name: setup the systemd file and restart the service
  ansible.builtin.import_role:
     name: common
     tasks_from: systemd-setup